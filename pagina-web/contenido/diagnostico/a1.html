<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="David Estiven Sánchez Yomayuza">
  <meta name="theme-color" content="#11151a">
  <title>Diagnóstico A1 · English Cundi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/estilo.css">
  <link rel="stylesheet" href="/static/css/diagnostico.css">
  <link rel="icon" href="/static/img/logo.svg" type="image/svg+xml">
</head>
<body class="pagina-app pagina-prueba">
  <a class="salto" href="#contenido">Saltar al contenido</a>
  <header class="barra">
    <div class="barra-interior">
      <a class="logo" href="/">
        <img src="/static/img/logo.svg" alt="" width="40" height="40">
        <span>English Cundi</span>
      </a>
      <div class="barra-prueba">
        <p class="reloj" id="reloj" hidden>
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v5l3 2M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z"/></svg>
          <span>00:00</span>
        </p>
        <a class="boton boton-fantasma salir-prueba" href="/panel">Salir</a>
      </div>
    </div>
  </header>

  <div class="prueba">
    <ol class="pasos" id="pasos" aria-label="Paradas de la prueba" hidden></ol>
    <main id="contenido" class="prueba-cuerpo">
      <noscript><p class="aviso aviso-error">Esta prueba necesita JavaScript. Actívalo en tu navegador y recarga la página.</p></noscript>
    </main>
  </div>

  <dialog id="confirmar" aria-labelledby="confirmar-t">
    <div class="interior">
      <h2 id="confirmar-t">¿Terminar la prueba?</h2>
      <p></p>
      <div class="acciones">
        <button type="button" class="boton boton-principal" data-si>Ver mi resultado</button>
        <button type="button" class="boton boton-claro" data-no>Seguir revisando</button>
      </div>
    </div>
  </dialog>
  <div class="carril" aria-hidden="true"></div>
  <a class="boton-ayuda" href="/ayuda" target="_blank" rel="noopener"
     title="Te atendemos por Telegram" aria-label="¿Necesitas ayuda? Te atendemos por Telegram">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M21.9 4.6 18.7 19.7c-.2 1-.9 1.3-1.8.8l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.3-5 9.1-8.2c.4-.4-.1-.6-.6-.2L6.2 13.4l-4.8-1.5c-1-.3-1-1 .2-1.5L20.5 3.1c.9-.3 1.6.2 1.4 1.5z"/></svg>
    <span>¿Necesitas ayuda?</span>
  </a>

  <script>
  window.DIAGNOSTICO = {
    id: 'a1',
    titulo: 'Diagnóstico A1',
    descripcion: 'Una prueba corta para saber cómo vas en inglés básico: vocabulario, gramática, lectura, escucha y escritura.',
    minutos: '15 a 20',
    escuchas: 2,
    velocidad: 0.85,
    niveles: [
      { min: 0, id: 'Pre-A1', titulo: 'Estás empezando',
        texto: 'Todavía te cuesta reconocer las palabras y frases más comunes. Es normal si estás empezando. Empieza por los saludos, los números, los días de la semana y los verbos to be y have, y vuelve a hacer esta prueba en unas semanas.' },
      { min: 40, id: 'A1', titulo: 'Nivel básico',
        texto: 'Entiendes y usas frases sencillas sobre ti, tu familia y tu día a día. Tu ruta es reforzar las plantillas de nivel A1 y luego hacer la prueba de conocimiento A1.' },
      { min: 75, id: 'A1 sólido', titulo: 'Listo para el siguiente paso',
        texto: 'Dominas bien lo básico. Repasa solo los ejercicios que fallaste y prueba el diagnóstico A2 para ver hasta dónde llegas.' }
    ],
    secciones: [
      { titulo: 'Vocabulario', corto: 'Vocabulario', hab: 'Vocabulario',
        instr: 'Elige la palabra o frase correcta para cada oración.',
        items: [
          { t: 'mc', q: 'Monday, ___, Wednesday.', o: ['Tuesday', 'Friday', 'Sunday'], a: 0, e: 'Los días van en orden: Monday, Tuesday, Wednesday.' },
          { t: 'mc', q: "My father's mother is my ___.", o: ['aunt', 'grandmother', 'sister'], a: 1, e: 'La mamá de tu papá es tu abuela: grandmother.' },
          { t: 'mc', q: 'You eat soup with a ___.', o: ['fork', 'knife', 'spoon'], a: 2, e: 'Spoon es la cuchara.' },
          { t: 'mc', q: "The opposite of 'hot' is ___.", o: ['cold', 'big', 'new'], a: 0, e: 'Hot (caliente) y cold (frío) son opuestos.' },
          { t: 'mc', q: "It's 7:30. We say: \"It's ___ past seven.\"", o: ['quarter', 'half', 'twenty'], a: 1, e: 'Half past es y media.' },
          { t: 'mc', q: 'We wear ___ on our feet.', o: ['gloves', 'shoes', 'scarves'], a: 1, e: 'Shoes son los zapatos.' }
        ] },
      { titulo: 'Gramática', corto: 'Gramática', hab: 'Gramática',
        instr: 'Elige la opción que completa bien cada oración.',
        items: [
          { t: 'mc', q: 'I ___ a student.', o: ['am', 'is', 'are'], a: 0, e: 'Con I se usa am.' },
          { t: 'mc', q: 'She ___ from Colombia.', o: ['am', 'is', 'are'], a: 1, e: 'Con she se usa is.' },
          { t: 'mc', q: '___ you have a brother?', o: ['Do', 'Does', 'Are'], a: 0, e: 'Con you se pregunta con do.' },
          { t: 'mc', q: 'There ___ two books on the table.', o: ['is', 'are', 'am'], a: 1, e: 'Con plural (two books) se usa there are.' },
          { t: 'mc', q: 'My mother ___ coffee every morning.', o: ['drink', 'drinks', 'drinking'], a: 1, e: 'Con he, she o it, el verbo lleva s: drinks.' },
          { t: 'mc', q: 'This is ___ orange.', o: ['a', 'an', 'the'], a: 1, e: 'Orange empieza con sonido de vocal, por eso an.' },
          { t: 'mc', q: '___ is your name?', o: ['Who', 'What', 'Where'], a: 1, e: 'What is your name? es la pregunta para el nombre.' },
          { t: 'mc', q: 'He ___ TV at the moment.', o: ['watch', 'watches', 'is watching'], a: 2, e: 'At the moment indica que pasa ahora: presente continuo (is watching).' }
        ] },
      { titulo: 'Completa la oración', corto: 'Completa', hab: 'Gramática',
        instr: 'Escribe la palabra que falta. Una sola respuesta por espacio.',
        items: [
          { t: 'fill', q: 'She ___ two sisters. (have)', a: ['has'], e: 'Con she, have cambia a has.' },
          { t: 'fill', q: 'They ___ football on Sundays. (play)', a: ['play'], e: 'Con they el verbo no cambia: play.' },
          { t: 'fill', q: 'There ___ a cat under the chair. (be)', a: ['is'], e: 'Un solo gato: there is.' },
          { t: 'fill', q: 'I ___ like fish. (forma negativa)', a: ["don't", 'do not'], e: 'La negación de I like es I don’t like.' },
          { t: 'fill', q: 'What ___ you doing now? (be)', a: ['are'], e: 'Con you se usa are.' },
          { t: 'fill', q: 'He goes to school ___ bus. (una preposición)', a: ['by'], e: 'By bus significa en bus.' }
        ] },
      { titulo: 'Une las palabras', corto: 'Une', hab: 'Vocabulario',
        instr: 'Elige el significado de cada palabra en el menú.',
        items: [
          { t: 'match', q: 'Une cada palabra con su significado.',
            pares: [
              ['teacher', 'a person who works at a school'],
              ['kitchen', 'the room where you cook'],
              ['Sunday', 'the day after Saturday'],
              ['breakfast', 'the first meal of the day'],
              ['window', 'you open it to get fresh air']
            ],
            e: 'Si te equivocaste, repasa estas cinco palabras.' }
        ] },
      { titulo: 'Ordena la oración', corto: 'Ordena', hab: 'Gramática',
        instr: 'Toca las palabras en el orden correcto para formar la oración.',
        items: [
          { t: 'order', q: 'Forma una oración sobre tu rutina.', fichas: ['every day', 'I', 'at six', 'get up'], a: 'I get up at six every day', e: 'Orden básico: quién, qué hace, cuándo.' },
          { t: 'order', q: 'Forma una pregunta.', fichas: ['you', '?', 'Where', 'live', 'do'], a: 'Where do you live?', e: 'Pregunta: palabra interrogativa + do + sujeto + verbo.' },
          { t: 'order', q: 'Forma una oración negativa.', fichas: ['at', 'home', '.', 'She', 'not', 'is'], a: 'She is not at home.', e: 'Con to be, not va después del verbo: is not.' }
        ] },
      { titulo: 'Lectura', corto: 'Lectura', hab: 'Lectura',
        instr: 'Lee el texto y responde las preguntas. Puedes mirar el texto cuando quieras.',
        textoTitulo: 'About Ana',
        texto: [
          'Hi! My name is Ana. I am 19 years old and I live in Chía with my family. I study systems engineering at university.',
          'I have one brother, Luis. He is 15 and he plays football every day. On Saturdays we visit my grandmother. She cooks soup and we eat together.'
        ],
        items: [
          { t: 'mc', q: 'Ana is 19 years old.', o: ['True', 'False'], a: 0, e: 'El texto dice: I am 19 years old.' },
          { t: 'mc', q: 'Luis is older than Ana.', o: ['True', 'False'], a: 1, e: 'Luis tiene 15 y Ana 19, así que Luis es menor.' },
          { t: 'mc', q: 'Where does Ana live?', o: ['In Bogotá', 'In Chía', 'In Cali'], a: 1, e: 'El texto dice: I live in Chía.' },
          { t: 'mc', q: 'What does Luis do every day?', o: ['He cooks soup.', 'He plays football.', 'He studies engineering.'], a: 1, e: 'Dice: he plays football every day.' },
          { t: 'mc', q: 'When do they visit their grandmother?', o: ['On Saturdays', 'On Sundays', 'Every day'], a: 0, e: 'Dice: On Saturdays we visit my grandmother.' }
        ] },
      { titulo: 'Escucha', corto: 'Escucha', hab: 'Escucha',
        instr: 'Presiona Escuchar y responde. Cada audio se puede oír dos veces.',
        items: [
          { t: 'fill', digitos: true, q: 'Escribe los últimos cuatro números del teléfono (con cifras).',
            audio: [{ t: 'My phone number is three, one, two, five, five, five, one, two, three, four.', v: 'f' }],
            a: ['1234'], e: 'El número termina en one, two, three, four: 1234.' },
          { t: 'mc', q: '¿A qué hora empieza la clase?',
            audio: [{ t: 'The class starts at half past eight on Monday.', v: 'm' }],
            o: ['8:15', '8:30', '7:30'], a: 1, e: 'Half past eight es 8:30.' },
          { t: 'mc', q: 'What does the second person like?',
            audio: [{ t: 'Do you like pizza?', v: 'f' }, { t: "No, I don't. I like chicken and rice.", v: 'm' }],
            o: ['Pizza', 'Chicken and rice', 'Fish'], a: 1, e: 'Responde: No, I don’t. I like chicken and rice.' },
          { t: 'fill', q: 'Completa: She is wearing a ___ jacket.',
            audio: [{ t: 'She is wearing a red jacket and blue jeans.', v: 'f' }],
            a: ['red'], e: 'Escuchaste red jacket (chaqueta roja).' }
        ] },
      { titulo: 'Escritura', corto: 'Escritura', hab: 'Escritura',
        instr: 'Escribe un texto corto en inglés. No importa si cometes errores, lo importante es comunicar.',
        items: [
          { t: 'write', q: 'Preséntate en 30 palabras o más: tu nombre, tu edad, dónde vives, tu familia o amigos y algo que te gusta.',
            min: 30,
            checks: [
              { label: 'Dices tu nombre (My name is…)', re: "(my name is|i am|i'm|i’m)\\s+[a-z]+" },
              { label: 'Dices tu edad (… years old)', re: "(\\d+\\s*(years old|años)|i am \\d+|i'm \\d+|i’m \\d+)" },
              { label: 'Dices dónde vives (I live in…)', re: "(i live|live in|i am from|i'm from|i’m from)" },
              { label: 'Dices algo que te gusta (I like…)', re: '(i like|i love|i enjoy|my favourite|my favorite)' }
            ],
            modelo: 'Hello! My name is Carlos. I am 20 years old. I live in Chía with my mother, my father and my sister. I study at the university. I like music and I play football with my friends on Saturdays.' }
        ] }
    ]
  };
  </script>
  <script src="/static/js/progreso.js"></script>
  <script src="/static/js/diagnostico.js"></script>
</body>
</html>
