<header class="barra">
  <div class="barra-interior">
    <a class="logo" href="{{ url_for('portada') }}">
      <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="" width="40" height="40">
      <span>English Cundi</span>
    </a>
    <nav class="menu-principal" aria-label="Principal">
      <a href="{{ url_for('portada') }}"{% if activa == 'portada' %} aria-current="page"{% endif %}>Inicio</a>
      {% if session.get('usuario_id') %}
      <a href="{{ url_for('inicio') }}"{% if activa == 'panel' %} aria-current="page"{% endif %}>Panel</a>
      <a href="{{ url_for('practica') }}"{% if activa == 'practica' %} aria-current="page"{% endif %}>Práctica</a>
      {% endif %}
    </nav>
    <div class="barra-usuario">
      {% if session.get('usuario_id') %}
      <span class="avatar" aria-hidden="true">{{ session.get('nombre', '?')[:1]|upper }}</span>
      <span class="barra-nombre">{{ session.get('nombre') }}</span>
      <form method="post" action="{{ url_for('salir') }}">
        <input type="hidden" name="csrf" value="{{ token_csrf() }}">
        <button type="submit" class="boton boton-fantasma">Salir</button>
      </form>
      {% else %}
      <a class="boton boton-fantasma" href="{{ url_for('login') }}">Entrar</a>
      <a class="boton boton-principal boton-corto" href="{{ url_for('registro') }}">Crear cuenta</a>
      {% endif %}
    </div>
  </div>
</header>
